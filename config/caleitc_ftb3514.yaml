# =============================================================================
# CalEITC schedule parameters, TY2015-TY2019 — VERIFIED against FTB Form 3514
# instructions (the primary source). Extracted 2026-07-05.
#
# Sources (fetched 2026-07-05; full credit tables parsed into
# data/eitc_parameters/ftb3514/caleitc_table_{year}.csv):
#   2015: https://www.ftb.ca.gov/forms/2015/15_3514ins.pdf
#   2016: https://www.ftb.ca.gov/forms/2016/16_3514ins.pdf
#   2017: https://www.ftb.ca.gov/forms/2017/17-3514-instructions.html
#   2018: https://www.ftb.ca.gov/forms/2018/18-3514-instructions.html
#   2019: https://www.ftb.ca.gov/forms/2019/2019-3514-instructions.html
#
# !! Supersedes the eitc_california block in parameters.yaml and the values
# hard-coded in 02b_caleitc_param_gen.do / 02_eitc_param_prep.do, which do
# NOT match FTB 3514 for any year (see PLAN.md; audit 2026-07-05). Known
# error patterns in the old values: phase-in rates of 0.50 x federal instead
# of the statutory 0.85 x federal; max_income taken from the wrong QC row
# (e.g. TY2017 15,009 is the 0-QC limit, not the 1-3 QC limit of ~22,300);
# and childless (qc0) filers coded ineligible before 2018 when they were
# eligible from TY2015.
#
# Field provenance:
#   phasein_rate  = 0.85 x federal phase-in rate (statutory design, RTC
#                   §17052; confirmed to 3-4 decimals by table slopes and by
#                   max_credit / kink1).
#   kink1         = earned income where max credit is reached. Stated in the
#                   instructions' CalEITC Worksheet line 5 ("is the amount on
#                   line 3 less than $X"); equals half the federal kink1.
#                   CalEITC has no plateau: phase-out starts at kink1.
#   max_credit    = maximum of the year's credit-table column.
#   phaseout      = piecewise-linear segments recovered from the credit table.
#                   TY2015-16: single segment at the phase-in rate (symmetric
#                   triangle) hitting zero at the federal kink1. TY2017+ (SB
#                   106): steep segment at the phase-in rate down to
#                   `breakpoint`, then a flat second segment to zero at
#                   max_income. Breakpoints/rates are least-squares-free
#                   analytic fits to the table; reconstruction reproduces
#                   every $50 bin within $6 (within $19 for TY2018 qc>=1,
#                   where FTB's published table itself contains a duplicated
#                   row at $8,101-8,200).
#   max_income    = credit cliff. Both earned income AND federal AGI must be
#                   below this to claim (per-QC values from table footnotes).
#
# The $50-bin lookup tables in data/eitc_parameters/ftb3514/ are the ground
# truth the FTB actually applied; use them directly where exactness matters.
# (Missing from the CSVs: the $1-50 bin (2015-16) and the irregular footnote
# bins at the cliff, e.g. $6,551-6,580 for 2015 qc0, where credit is $1-5.)
# =============================================================================

