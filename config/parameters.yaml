# =============================================================================
# CalEITC Labor Supply — consolidated analysis parameters
#
# Single source of truth for constants previously duplicated (and in places
# inconsistent) across 01_clean_data.do, 02_eitc_param_prep.do,
# 02b_caleitc_param_gen.do, 02_mvpf.do, 03_fig_spec_curve.do, and
# 04_appA_fig_spec_curve_reported.do. Values transcribed 2026-07-04 from the
# audit in PLAN.md §D Phase 1; file:line provenance noted per block.
#
# Load in R via code/R/utils/config.R (yaml::read_yaml). During the migration
# the Stata pipeline keeps its own copies; this file is authoritative for R.
# =============================================================================

years:
  analysis_start: 2012          # 00_caleitc.do
  analysis_end: 2017
  data_start: 2006
  data_end: 2019
  treatment_base: 2014          # last pre-period year (event-study base)
  caleitc_start: 2015           # first CalEITC tax year (enacted June 2015)

seed: 56403

sample:
  age_min: 20
  age_max: 49
  age_max_alt: 64               # alternate sample used in spec curves
  full_time_hours: 35           # usual hours/week threshold
  full_time_hours_alts: [31, 39]  # alt thresholds in 01_clean_data.do:360-373

# -----------------------------------------------------------------------------
# State classification (FIPS). Source of truth: 01_clean_data.do:513-530
# (state_status: 2 = treated, 1 = control, 0 = EITC-change (dropped),
# -1 = excluded).
# -----------------------------------------------------------------------------
states:
  treated: 6                    # California
  excluded: [2, 11]             # Alaska, DC
  # States with their own EITC changes in-window; dropped from the control
  # pool when building state_status (01_clean_data.do:520):
  eitc_change:
    [8, 9, 15, 17, 19, 20, 22, 23, 24, 25, 26, 27, 30, 34, 35, 39, 41, 44,
     45, 50, 55]
  # Named alternative control pools (02_mvpf.do:121-146; duplicated verbatim
  # in 03_fig_spec_curve.do:82-96 and 04_appA_fig_spec_curve_reported.do:97-111):
  pools:
    # RESOLVED 2026-07-04: this list is NOT in conflict with eitc_change
    # above — in the Stata code it is applied AFTER `keep if state_status > 0`,
    # i.e. after the eitc_change states are already dropped. So it only names
    # the additional STABLE-EITC states (10 DE, 18 IN, 31 NE, 40 OK, 49 UT,
    # 51 VA), and omitting the changers 20 KS / 22 LA is correct. The 2 and 11
    # entries are redundant (always excluded) but harmless. The R port must
    # preserve the same order of operations: baseline pool first, then this
    # drop. (Minor flag: 49 UT had no state EITC pre-2022 — verify against
    # TPC data if this pool is ever revisited.)
    no_state_eitc_drop:
      [2, 8, 9, 10, 11, 15, 17, 18, 19, 23, 24, 25, 26, 27, 30, 31, 34, 35,
       39, 40, 41, 44, 45, 49, 50, 51, 55]
    # contrs==2 "Medicaid expansion by 2014": KEEP these FIPS
    medicaid_2014_keep:
      [4, 5, 6, 8, 9, 10, 11, 15, 17, 19, 21, 24, 25, 26, 27, 32, 33, 34,
       35, 36, 38, 39, 41, 44, 50, 53, 54]
    # contrs==3 "minimum-wage increase in 2014": KEEP these FIPS
    minwage_2014_keep: [6, 9, 10, 26, 27, 34]

# -----------------------------------------------------------------------------
# Price indices. RESOLVED 2026-07-04 (canonical policy for the R port):
#   * CANONICAL: IPUMS cpi99, base year 2019, for ALL person-level income
#     deflation (this is already the main-results convention; the paper's
#     earnings tables state "real 2019 dollars"). The cpi99 table below is
#     EMPIRICAL — extracted from data/acs/acs_{year}.csv on 2026-07-04,
#     constant within year (verified: 2015 has a single value across all
#     2,997,503 rows). real_2019 = nominal * cpi99[year] / cpi99[2019].
#   * CPI-U-RS: retained ONLY for CalEITC kink backcasting inside parameter
#     generation (02b; base-2015 relative deflator, 2017-USD display) — a
#     parameter-construction methodology, not an income deflator.
#   * CPI-U (02_mvpf.do, base 2017): LEGACY — the Phase 4 MVPF port replaces
#     it with cpi99-based 2019 factors so welfare numbers share the canonical
#     base; recorded until then so nothing silently changes.
#   * Figure-specific bases (2014 in fig_earn_hist, 2017 in fig_earn_bins)
#     migrate to the canonical 2019 base when those figures are ported.
# -----------------------------------------------------------------------------
prices:
  canonical:
    series: cpi99
    base_year: 2019
  # IPUMS cpi99 by ACS year (empirical; see note above). The former Stata
  # fallback 0.811 (01_clean_data.do:64) was WRONG — true 2015 value is
  # 0.703; fixed in Stata the same day (fallback never triggered on any run
  # that produced committed results, so no numbers change).
  cpi99:
    2006: 0.826
    2007: 0.803
    2008: 0.774
    2009: 0.777
    2010: 0.764
    2011: 0.741
    2012: 0.726
    2013: 0.715
    2014: 0.704
    2015: 0.703
    2016: 0.694
    2017: 0.679
    2018: 0.663
    2019: 0.652
  # CPI-U-RS (02b_caleitc_param_gen.do:159-170; deflator base 2015 = 372.2,
  # real values expressed in 2017 USD via 385.0):
  cpi_u_rs:
    2010: 340.5
    2011: 352.5
    2012: 359.7
    2013: 365.0
    2014: 370.9
    2015: 372.2
    2016: 377.0
    2017: 385.0
  # CPI-U all items (02_mvpf.do:776-785; base 2017 = 245.121):
  cpi_u:
    2015: 237.002
    2016: 240.005
    2017: 245.121
    2018: 251.100
    2019: 255.653

# -----------------------------------------------------------------------------
# EITC schedules, nominal USD, keyed by tax_year then qualifying-child count.
# Federal TY2016: 02_eitc_param_prep.do:28-69 (duplicated as locals at
# 145-188). CalEITC TY2015-2017: 02b_caleitc_param_gen.do:62-149 (TY2016 also
# duplicated in 02_eitc_param_prep.do:87-123 and 191-224; values agree).
# kink1 = end of phase-in ("max_earned" in 02_eitc_param_prep,
# "pwages_nominal" in 02b); kink2 = end of plateau / start of phase-out.
# CalEITC has no plateau (kink2 = kink1) and qc0 is ineligible.
# Pre-2015 CalEITC "schedules" used in simulations are CPI-backcast from
# TY2015 (02b), not independently legislated — derive, don't store.
# -----------------------------------------------------------------------------
eitc_federal:
  2016:
    qc0: {phasein_rate: 0.0765, kink1: 6610,  max_credit: 506,
          kink2: 8270,  phaseout_rate: 0.0765, max_income: 14880}
    qc1: {phasein_rate: 0.34,   kink1: 10180, max_credit: 3373,
          kink2: 18190, phaseout_rate: 0.1598, max_income: 39296}
    qc2: {phasein_rate: 0.40,   kink1: 14290, max_credit: 5572,
          kink2: 18190, phaseout_rate: 0.2106, max_income: 44648}
    qc3: {phasein_rate: 0.45,   kink1: 14290, max_credit: 6269,
          kink2: 18190, phaseout_rate: 0.2106, max_income: 47955}

